[package]
name = "feathertalk-worker"
version = "0.1.0"
edition = "2024"
[features]
default = ["flex"]
flex = ["feathertalk-engine/flex"]
cpu = ["flex"]
cuda = ["feathertalk-engine/cuda"]
vulkan = ["feathertalk-engine/vulkan"]
metal = ["feathertalk-engine/metal"]
[dependencies]
feathertalk-core = { path = "../feathertalk-core" }
feathertalk-engine = { path = "../feathertalk-engine", default-features = false }
serde_json = "1"
serde = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
