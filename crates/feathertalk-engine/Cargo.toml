[package]
name = "feathertalk-engine"
version = "0.1.0"
edition = "2024"
[features]
default = ["flex"]
flex = ["burn/flex"]
cpu = ["flex"]
dev-visual-fixtures = []
vulkan = ["burn/vulkan"]
cuda = ["burn/cuda"]
metal = ["burn/metal"]
[dependencies]
burn = { version = "=0.22.1", default-features = false, features = ["std", "autodiff", "optim"] }
feathertalk-core = { path = "../feathertalk-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
safetensors = "0.5.3"
sha2 = "0.10"
semver = "1"
burn-store = { version = "=0.22.1", default-features = false, features = ["std"] }
